<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Corrispettivi</title>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --ink: #000; --muted: #000; --line: #dfe3ea;
    --accent: #1f5fae; --accent-soft: #e8f0fb; --sun: #fbeeee; --sat: #f7f7fa;
    --tot: #eef6ee; --warn: #000;
    --grid: #000;   /* contorni di tabelle e caselle (app) */
    --p-line: #000; /* contorni in stampa e PDF */
    --hl: #e3edfb; --hl-x: #c9dcf7; --hl-th: #a9c6ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: clamp(13px, 0.25vw + 10.5px, 16px)/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; }
  header.bar h1 { font-size: 1.3em; margin: 0 12px 0 0; white-space: nowrap; }
  header.bar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .menu-btn { display: none; }
  .spacer { flex: 1; }
  button, select { font: inherit; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #c9dcf7; color: #000; border-color: var(--accent); font-weight: 600; }
  /* schede dei mesi sempre visibili sotto la barra in alto mentre si scorre */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 20px 0; position: sticky; top: var(--top-h, 58px); z-index: 4;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs button { flex: 0 0 auto; }
  .tabs button { border-radius: 6px 6px 0 0; border-bottom: none; padding: 6px 12px; }
  .tabs button.active { background: #c9dcf7; color: #000; border-color: var(--accent); font-weight: 700; }
  main { padding: 0 20px 40px; }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 0 8px 8px 8px;
    padding: 16px; }
  /* su PC la tabella non ha scroll proprio: l'intestazione resta fissa sotto la barra mentre scorri la pagina */
  .table-wrap { overflow: visible; }
  table.reg thead { position: sticky; top: var(--bar-h, 58px); z-index: 3; }
  table.reg thead th { box-shadow: inset 0 -1px 0 var(--grid); }
  .sheet-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
  .company { white-space: pre-line; font-size: .85em; color: var(--muted); }
  .title { text-align: right; font-weight: 600; white-space: pre-line; }
  table.reg { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1080px; table-layout: fixed; font-variant-numeric: tabular-nums; }
  .tot-wrap { margin-top: 16px; }
  table.reg th, table.reg td { border-width: 0 1px 1px 0; }
  table.reg tr > :first-child { border-left-width: 1px; }
  table.reg tr.h1 th { border-top-width: 1px; }
  table.reg a { color: inherit; }
  /* colonna Giorno sempre visibile quando la tabella scorre */
  table.reg td.day, table.reg tr.sum td.lbl, table.reg tr.h1 th:first-child {
    position: sticky; left: 0; z-index: 1; background: var(--surface); }
  table.reg tr.h1 th:first-child { background: #e6eaf1; }
  table.reg tr.sum td.lbl { background: #f0f2f6; }
  table.reg tr.sum.grand td.lbl { background: #dde6f3; }
  table.reg th, table.reg td { border-style: solid; border-color: var(--grid); padding: 0; text-align: center; }
  table.reg tr.h1 th, table.reg tr.h2 th { background: #f0f2f6; font-size: .95em; font-weight: 700; line-height: 1.25; padding: 9px 4px;
    hyphens: manual; }
  /* riga alta delle intestazioni (gruppi, Giorno, Totale) più bassa; la riga 4% / 10% / ... resta com'è */
  table.reg tr.h1 th { padding: 3px 4px; line-height: 1.12; }
  table.reg th.grp { background: #e6eaf1; }
  table.reg td.day { width: 70px; padding: 3px 6px; text-align: left; white-space: nowrap; font-size: 1.2em; font-weight: 600; }
  table.reg td.day small { font-size: .68em; font-weight: 400; }
  table.reg td.day small { color: var(--muted); margin-left: 4px; }
  table.reg tr.sun td.day { background: var(--sun); color: var(--warn); }
  table.reg tr.sat td.day { background: var(--sat); }
  table.reg td.total { background: var(--tot); font-weight: 700; font-size: 1.15em; text-align: right; padding: 3px 8px; min-width: 90px; }
  table.reg input { width: 100%; border: 0; background: transparent; font: inherit; padding: 5px 6px;
    text-align: right; min-width: 64px; }
  table.reg input.txt { text-align: left; }
  table.reg input:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
  /* evidenziazione a croce: riga + colonna sotto il cursore */
  table.reg td.hl, table.reg tr.sum td.hl { background-color: var(--hl) !important; }
  table.reg td.hl-x, table.reg tr.sum td.hl-x { background-color: var(--hl-x) !important; }
  table.reg th.hl { background-color: var(--hl-th) !important; color: #000; }
  table.reg tr.sum td { background: #f0f2f6; font-weight: 600; text-align: right; padding: 5px 8px; }
  table.reg tr.sum td.lbl { text-align: left; }
  /* riepilogo annuale: nome del mese più piccolo per stare intero nella colonna */
  table.reg tr.sum td.lbl a { font-size: .84em; letter-spacing: -.01em; }
  table.reg tr.sum td.lbl:has(a) { padding-left: 4px; padding-right: 2px; white-space: nowrap; }
  table.reg tr.sum td:not(.lbl) { font-size: 1.15em; font-weight: 700; }
  table.reg tr.sum.grand td { background: #dde6f3; }
  /* colonna dei totali mensili/annuale in verde come i totali giornalieri */
  table.reg tr.sum td.tsum { background: var(--tot); }
  .bottom { display: grid; grid-template-columns: minmax(320px, 520px) 1fr minmax(280px, 420px); gap: 20px; margin-top: 18px; align-items: start; }
  .vers .vbox { border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
  .vers label { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 8px; font-size: .95em; }
  .vers input { font: inherit; padding: 6px 8px; border: 1px solid var(--grid); border-radius: 6px; width: 100%;
    color: var(--ink); background: var(--surface); }
  .vers input.vamt { text-align: right; }
  .vers input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  table.iva { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.iva th, table.iva td { border: 1px solid var(--grid); padding: 5px 8px; text-align: right; }
  table.iva th { background: #f0f2f6; font-size: .95em; font-weight: 700; padding: 8px; }
  table.iva td:first-child, table.iva th:first-child { text-align: left; }
  table.iva tr.tot td { font-weight: 600; background: #f0f2f6; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .note { font-size: 12px; color: var(--muted); }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; margin-top: 28px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 140px; }
  .kpi span { display: block; font-size: 12px; color: var(--muted); }
  .kpi b { font-size: 17px; font-variant-numeric: tabular-nums; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(560px, 92vw); }
  dialog label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
  dialog textarea { width: 100%; height: 130px; font: inherit; padding: 6px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #dlgAsk, #dlgUpdate { width: min(420px, 92vw); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #fff; color: #000; border: 1px solid var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,.12);
    padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* schede giorno (telefono) */
  .days { display: none; }
  .dcard { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--surface); }
  .dcard summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; list-style: none; }
  .dcard summary::-webkit-details-marker { display: none; }
  .dcard summary::after { content: '▸'; color: var(--muted); transition: transform .15s; }
  .dcard[open] summary::after { transform: rotate(90deg); }
  .dcard .dnum { font-weight: 700; min-width: 64px; }
  .dcard .dnum small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .dcard.sun .dnum { color: var(--warn); }
  .dcard .dsum { flex: 1; font-size: .8em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dcard .total { font-weight: 700; font-variant-numeric: tabular-nums; }
  .dcard .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 10px;
    padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .dcard .fields label { font-size: .75em; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .dcard .fields input { font: inherit; font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    text-align: right; width: 100%; color: var(--ink); background: var(--surface); }
  .dcard .fields input.txt { text-align: left; }
  .dcard .fields input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .mtotals { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #dde6f3; }
  .mtotals h3 { margin-bottom: 6px; }
  .mtotals dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 0; font-variant-numeric: tabular-nums; }
  .mtotals dd { margin: 0; text-align: right; font-weight: 600; }

  /* tablet e schermi stretti */
  @media (max-width: 1180px) {
    header.bar { padding: 10px 14px; gap: 8px; }
    .menu-btn { display: inline-block; }
    header.bar .actions { display: none; position: absolute; top: 100%; right: 10px; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 200px; }
    header.bar .actions.open { display: flex; }
    header.bar .actions button { text-align: left; }
    .tabs { padding: 10px 14px 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
    main { padding: 0 14px 30px; }
    .bottom { grid-template-columns: 1fr; }
    /* tablet: la tabella scorre dentro il suo riquadro, con intestazione e colonna Giorno fisse */
    .table-wrap { overflow: auto; -webkit-overflow-scrolling: touch;
      max-height: calc(100vh - var(--bar-h, 58px) - 60px); }
    table.reg thead { top: 0; }
  }
  /* telefono */
  @media (max-width: 720px) {
    header.bar h1 { font-size: 1.05em; margin: 0; }
    header.bar { gap: 6px; padding: 8px 10px; }
    .hide-xs { display: none; }
    header.bar label { font-size: .9em; }
    .sheet { padding: 12px; border-radius: 0 0 8px 8px; }
    .sheet-head { flex-direction: column; gap: 6px; }
    .title { text-align: left; }
    .company { display: none; }
    .sheet.cards .days { display: block; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; }
    .sheet.cards .kpis { display: none; }
    .kpi { min-width: 0; }
    table.iva th, table.iva td { padding: 4px 5px; font-size: .9em; }
    .toast { left: 14px; right: 14px; text-align: center; }
  }
  .print-only { display: none; }

  /* foglio A4: usato per la stampa e per il PDF */
  #printArea { display: none; }
  #printArea, #printArea * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printArea, .pv-content { width: 194mm; background: #fff; color: var(--ink);
    font: 7pt/1.15 "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  /* anteprima di stampa: foglio A4 ridimensionato per stare nello schermo */
  #dlgPreview { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; overflow: auto;
    border: 0; border-radius: 0; background: #e9ebef; }
  #dlgPreview::backdrop { background: rgba(0,0,0,.4); }
  .pv-bar { position: sticky; top: 0; left: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .pv-bar h3 { margin: 0 auto 0 0; font-size: 1.1em; }
  .pv-stage { padding: 20px 10px 30px; cursor: grab; width: max-content; min-width: 100%; }
  .pv-stage.panning { cursor: grabbing; user-select: none; }
  .pv-stage:focus { outline: none; }
  .pv-page { width: 210mm; height: 297mm; padding: 7mm 8mm; margin: 0 auto; background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.25); overflow: hidden; }
  .pv-zoom { display: flex; align-items: center; gap: 4px; margin-right: 12px; }
  .pv-zoom button { min-width: 36px; }
  .pv-zoom .pct { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  @media (max-width: 720px) { .pv-zoom .fit { display: none; } .pv-bar h3 { width: 100%; } }
  .pv-content * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-head { display: flex; justify-content: space-between; align-items: flex-start; height: 21mm; overflow: hidden; }
  .p-company { white-space: pre-line; font-size: 6.8pt; line-height: 1.25; color: var(--muted); }
  .p-title { text-align: right; font-weight: 700; font-size: 8.5pt; white-space: pre-line; line-height: 1.3; }
  .p-reg { width: 194mm; table-layout: fixed; border-collapse: collapse; }
  .p-reg.p-tot { margin-top: 2.5mm; }
  .p-reg th, .p-reg td { border: 0.15mm solid var(--p-line); overflow: hidden; white-space: nowrap; }
  .p-reg th { font-size: 5.6pt; font-weight: 700; line-height: 1.1; padding: 0.4mm 0.3mm;
    white-space: normal; text-align: center; background: #f0f2f6; }
  .p-reg tr.grp th { background: #e6eaf1; }
  .p-reg tbody td { height: 6.1mm; padding: 0 0.8mm; text-align: right; font-size: 7pt; }
  .p-reg tbody td.d { text-align: left; }
  .p-reg tbody td.d small { font-size: 5.5pt; color: var(--muted); margin-left: 0.6mm; }
  .p-reg tbody td.t { text-align: left; font-size: 6pt; }
  .p-reg tbody td.tot { font-weight: 600; background: var(--tot); }
  .p-reg tr.sun td.d { background: var(--sun); color: var(--warn); }
  .p-reg tr.sun td.d small { color: var(--warn); }
  .p-reg tr.sat td.d { background: var(--sat); }
  .p-reg tr.sum td { font-weight: 600; background: #f0f2f6; height: 6.1mm; }
  .p-reg tr.sum.grand td { background: #dde6f3; }
  .p-reg tr.sum td.tot { background: var(--tot); }
  .p-reg tr.sum td.d { font-size: 6.3pt; }
  .p-reg tr.sum td.d:has(br) { white-space: normal; line-height: 1.05; }
  .p-bottom { display: grid; grid-template-columns: 105mm 1fr; gap: 5mm; margin-top: 3mm; }
  .p-iva { width: 100%; border-collapse: collapse; }
  .p-iva th, .p-iva td { border: 0.15mm solid var(--p-line); padding: 0.6mm 1.2mm; text-align: right; font-size: 6.8pt; }
  .p-iva th { background: #f0f2f6; font-size: 6pt; }
  .p-iva td:first-child, .p-iva th:first-child { text-align: left; }
  .p-iva tr.tot td { font-weight: 700; background: #f0f2f6; }
  .p-cap { font-weight: 700; font-size: 7pt; margin-bottom: 1mm; }
  .p-box { border: 0.15mm solid var(--p-line); padding: 1.2mm 2mm; font-size: 6.5pt; line-height: 1.9; }
  .p-box span { display: inline-block; border-bottom: 0.2mm dotted #000; min-width: 28mm; padding: 0 1mm; }
  .p-note { font-size: 5.6pt; margin-top: 1.5mm; }
  #printArea.pdf-render { display: block; position: fixed; left: -10000px; top: 0; }
  @media print {
    @page { size: A4 portrait; margin: 7mm 8mm; }
    html, body { background: #fff; }
    header.bar, .tabs, main, dialog, .toast { display: none !important; }
    #printArea { display: block; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Registro<span class="hide-xs"> dei</span> Corrispettivi</h1>
  <label>Anno <select id="yearSel"></select></label>
  <button id="newYear" title="Aggiungi un nuovo anno">+<span class="hide-xs"> Anno</span></button>
  <div class="spacer"></div>
  <button id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="actions">☰<span class="hide-xs"> Menu</span></button>
  <div class="actions" id="actions">
    <button id="btnPreview">Anteprima</button>
    <button id="btnPrint">Stampa</button>
    <button id="btnPdf" title="Scarica il PDF">⬇ PDF</button>
    <button id="btnExport" class="primary">Esporta Excel</button>
    <button id="btnImport">Importa Excel</button>
    <button id="btnBackup">Backup</button>
    <button id="btnRestore">Ripristina</button>
    <button id="btnSettings">Impostazioni</button>
  </div>
  <input type="file" id="fileXlsx" accept=".xlsx,.xls" hidden>
  <input type="file" id="fileJson" accept=".json" hidden>
</header>

<nav class="tabs" id="tabs"></nav>
<main><section class="sheet" id="sheet"></section></main>
<section id="printArea"></section>

<dialog id="dlgPreview" aria-label="Anteprima di stampa">
  <div class="pv-bar">
    <h3>Anteprima di stampa – A4</h3>
    <div class="pv-zoom">
      <button id="pvOut" title="Riduci (tasto −)">−</button>
      <span class="pct" id="pvPct">100%</span>
      <button id="pvIn" title="Ingrandisci (tasto +)">+</button>
      <button id="pvFitPage" class="fit" title="Mostra il foglio intero (tasto 0)">Pagina intera</button>
      <button id="pvFitWidth" class="fit" title="Adatta alla larghezza della finestra">Adatta larghezza</button>
    </div>
    <button id="pvPrint" class="primary">Stampa</button>
    <button id="pvPdf">⬇ PDF</button>
    <button id="pvClose">Chiudi</button>
  </div>
  <div class="pv-stage" tabindex="-1"><div class="pv-page"><div class="pv-content" id="pvContent"></div></div></div>
</dialog>

<dialog id="dlgAsk">
  <form method="dialog" id="askForm">
    <p id="askMsg" style="margin:0 0 12px; white-space:pre-line"></p>
    <input id="askInput" type="text" inputmode="numeric" style="width:100%; font:inherit; padding:6px 8px; display:none">
    <div class="actions">
      <button type="button" id="askCancel" value="cancel">Annulla</button>
      <button type="submit" id="askOk" class="primary" value="ok">OK</button>
    </div>
  </form>
</dialog>

<dialog id="dlgUpdate" aria-label="Aggiornamento disponibile">
  <h3 style="margin:0 0 8px">Aggiornamento disponibile</h3>
  <p id="updMsg" style="margin:0"></p>
  <div id="updBar" style="display:none; margin-top:12px; height:10px; border:1px solid var(--line); border-radius:5px; overflow:hidden">
    <div id="updFill" style="height:100%; width:0; background: var(--accent)"></div>
  </div>
  <div class="actions">
    <button id="updClose">Chiudi</button>
    <button id="updGo" class="primary">Aggiorna</button>
  </div>
</dialog>

<dialog id="dlgSettings">
  <h3>Impostazioni</h3>
  <label for="setCompany">Intestazione ditta (stampa ed export)</label>
  <textarea id="setCompany"></textarea>
  <label for="setPayRate">Aliquota IVA da applicare a POS / Bonifico / Assegni nel calcolo IVA</label>
  <select id="setPayRate">
    <option value="22">22%</option><option value="10">10%</option><option value="4">4%</option>
    <option value="0">Non conteggiare (sono già inclusi nelle colonne 4/10/22%)</option>
  </select>
  <p class="note">Nel tuo file il Totale giornaliero somma tutte le colonne (aliquote + POS + Assegni). L'app fa lo stesso, includendo anche Bonifico.</p>
  <div class="actions">
    <button id="setCancel">Annulla</button>
    <button id="setSave" class="primary">Salva</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';
const STORE_KEY = 'registroCorrispettivi_v1';
const MONTHS = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const WD = ['dom','lun','mar','mer','gio','ven','sab'];

// Colonne del registro. sum = entra nel Totale corrispettivi giornalieri.
const FIELDS = [
  { key: 'iva4',     label: '4%',            group: 'CORRISPETTIVI', sum: true,  rate: 4 },
  { key: 'iva10',    label: '10%',           group: 'CORRISPETTIVI', sum: true,  rate: 10 },
  { key: 'iva22',    label: '22%',           group: 'CORRISPETTIVI', sum: true,  rate: 22 },
  { key: 'pos',      label: 'POS',           group: 'CORRISPETTIVI', sum: true,  pay: true },
  { key: 'bonifico', label: 'BONIFICO',      group: 'CORRISPETTIVI', sum: true,  pay: true, isNew: true },
  { key: 'assegni',  label: 'ASSEGNI',       group: 'CORRISPETTIVI', sum: true,  pay: true },
  { key: 'esenti',   label: 'IMPORTO',       group: 'OPERAZIONI ESENTI O NON IMPONIBILI', sum: true },
  { key: 'titolo',   label: 'TITOLO E NORMA',group: 'OPERAZIONI ESENTI O NON IMPONIBILI', text: true },
  { key: 'fattDal',  label: 'DAL N.',        group: 'FATTURE', text: true },
  { key: 'fattAl',   label: 'AL N.',         group: 'FATTURE', text: true },
  { key: 'altri',    label: 'IMPORTO',       group: 'ALTRI IMPORTI PER OPERAZIONI NON SOGGETTE A REGISTRAZIONE IVA (1)', sum: true },
];
const NUM_FIELDS = FIELDS.filter(f => !f.text);

const DEFAULT_COMPANY = ''; // dati della ditta: si inseriscono da Impostazioni

// ---------- stato ----------
let db = load();
if (!Object.keys(db.years).length) db.years[new Date().getFullYear()] = {};
const today = new Date();
let curYear = db.years[today.getFullYear()] ? today.getFullYear() : Math.max(...Object.keys(db.years).map(Number));
let curMonth = curYear === today.getFullYear() ? today.getMonth() + 1 : 1; // 1..12, 0 = riepilogo annuo

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      d.settings = Object.assign({ company: DEFAULT_COMPANY, payRate: 22 }, d.settings);
      d.years = d.years || {};
      return d;
    }
  } catch (e) { console.warn(e); }
  return { settings: { company: DEFAULT_COMPANY, payRate: 22 }, years: { [new Date().getFullYear()]: {} } };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { toast('Impossibile salvare: ' + e.message); }
}

// ---------- utilità ----------
const fmt = n => (n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
const fmtIn = n => (n === undefined || n === null || n === '') ? '' : fmt(n);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
function parseNum(s) {
  s = String(s).trim().replace(/[€\s]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? round2(n) : NaN;
}
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const yearData = y => (db.years[y] = db.years[y] || {});
const monthData = (y, m) => { const yd = yearData(y); return (yd[m] = yd[m] || {}); };
const dayTotal = r => NUM_FIELDS.reduce((s, f) => s + (f.sum ? (r?.[f.key] || 0) : 0), 0);
function monthTotals(y, m) {
  const md = db.years[y]?.[m] || {};
  const t = { totale: 0 };
  NUM_FIELDS.forEach(f => t[f.key] = 0);
  for (const d in md) {
    NUM_FIELDS.forEach(f => t[f.key] += md[d][f.key] || 0);
    t.totale += dayTotal(md[d]);
  }
  return t;
}
function lastMonthLabel(y) {
  for (let m = 12; m >= 1; m--) if (monthTotals(y, m).totale) return `\nAggiornato fino a ${MONTHS[m - 1]} ${y}`;
  return '';
}
function addTotals(a, b) { const r = {}; for (const k in a) r[k] = a[k] + (b[k] || 0); return r; }
function ivaRows(t) {
  const pr = Number(db.settings.payRate);
  const rows = [4, 10, 22].map(rate => ({ rate, lordo: t['iva' + rate] }));
  if (pr) {
    const pay = (t.pos || 0) + (t.bonifico || 0) + (t.assegni || 0);
    rows.find(r => r.rate === pr).lordo += pay;
  }
  return rows.map(r => {
    const imposta = round2(r.lordo * r.rate / (100 + r.rate));
    return { ...r, imponibile: round2(r.lordo - imposta), imposta };
  });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2500);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- finestre di dialogo interne ----------
// Al posto di alert/confirm/prompt del sistema: nell'app desktop quelle finestre bloccano la tastiera
// (non si riesce più a scrivere nei campi) e "prompt" non funziona affatto.
function ask({ message, input = false, value = '', okOnly = false }) {
  const dlg = document.getElementById('dlgAsk'), inp = document.getElementById('askInput');
  document.getElementById('askMsg').textContent = message;
  inp.style.display = input ? 'block' : 'none'; inp.value = value;
  document.getElementById('askCancel').style.display = okOnly ? 'none' : '';
  return new Promise(resolve => {
    const done = ok => { dlg.removeEventListener('close', onClose); resolve(ok ? (input ? inp.value : true) : (input ? null : false)); };
    const onClose = () => done(dlg.returnValue === 'ok');
    document.getElementById('askCancel').onclick = () => { dlg.returnValue = 'cancel'; dlg.close(); };
    dlg.addEventListener('close', onClose);
    dlg.returnValue = '';
    dlg.showModal();
    (input ? inp : document.getElementById('askOk')).focus();
    if (input) inp.select();
  });
}
const uiAlert = message => ask({ message, okOnly: true });
const uiConfirm = message => ask({ message });
const uiPrompt = (message, value) => ask({ message, input: true, value: String(value) });

// ---------- render ----------
function renderYearSel() {
  const sel = document.getElementById('yearSel');
  const years = Object.keys(db.years).map(Number).sort();
  if (!years.includes(curYear)) years.push(curYear);
  sel.innerHTML = years.sort().map(y => `<option ${y === curYear ? 'selected' : ''}>${y}</option>`).join('');
}
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = MONTHS.map((m, i) =>
    `<button data-m="${i + 1}" class="${curMonth === i + 1 ? 'active' : ''}">${m}</button>`).join('')
    + `<button data-m="0" class="${curMonth === 0 ? 'active' : ''}">RIEPILOGO ANNO</button>`;
}
// larghezze colonne (%) uguali per la tabella dei giorni e per quella dei totali, così restano allineate
// colonna Giorno stretta e fissa; le altre 12 si dividono lo spazio in parti uguali
const colgroup = () => `<colgroup><col style="width:84px">${'<col>'.repeat(12)}</colgroup>`;
// a capo con trattino nelle parole lunghe, solo se non ci stanno
const hy = t => t.replace(/CORRISPETTIVI/g, 'CORRISPET&shy;TIVI').replace(/GIORNALIERI/g, 'GIORNA&shy;LIERI')
  .replace(/REGISTRAZIONE/g, 'REGISTRA&shy;ZIONE').replace(/OPERAZIONI/g, 'OPERA&shy;ZIONI');
function headRows(first = 'GIORNO', totLabel = 'TOTALE<br>CORRISPETTIVI<br>GIORNALIERI') {
  const groups = [];
  FIELDS.forEach(f => {
    const last = groups[groups.length - 1];
    if (last && last.name === f.group) last.span++; else groups.push({ name: f.group, span: 1 });
  });
  return `<tr class="h1"><th rowspan="2" class="grp">${first}</th><th rowspan="2" class="grp">${hy(totLabel)}</th>`
    + groups.map(g => `<th colspan="${g.span}" class="grp">${hy(g.name.startsWith('ALTRI') ? 'ALTRI IMPORTI NON SOGG. A REG. IVA (1)' : g.name)}</th>`).join('') + `</tr><tr class="h2">`
    + FIELDS.map(f => `<th>${f.label}</th>`).join('') + `</tr>`;
}
// sezione separata del totale: intestazione propria + riga del totale
const monthFoot = mt => headRows('', 'TOTALE<br>CORRISPETTIVI<br>MENSILI') + sumRow('TOTALE MESE', mt, 'grand');
const yearFoot = tot => headRows('', 'TOTALE<br>CORRISPETTIVI<br>ANNUALE') + sumRow('TOTALE ANNUO', tot, 'grand');
const totTable = rows => `<div class="table-wrap tot-wrap"><table class="reg tot-table">${colgroup()}<tbody id="foot">${rows}</tbody></table></div>`;
// riquadri dei totali del mese: tutte le colonne che formano il Totale mese
function kpisHtml(mt) {
  const box = (label, v) => `<div class="kpi"><span>${label}</span><b>€ ${fmt(v)}</b></div>`;
  const extra = [['esenti', 'Esenti'], ['altri', 'Altri importi']].filter(([k]) => mt[k]);
  return `<div class="kpis no-print">${box('Totale mese', mt.totale)}${box('4%', mt.iva4)}${box('10%', mt.iva10)}${box('22%', mt.iva22)}`
    + `${box('POS', mt.pos)}${box('Bonifico', mt.bonifico)}${box('Assegni', mt.assegni)}`
    + extra.map(([k, l]) => box(l, mt[k])).join('') + `</div>`;
}
function sumRow(label, t, cls = '') {
  return `<tr class="sum ${cls}"><td class="lbl">${label}</td><td class="tsum">${fmt(t.totale)}</td>`
    + FIELDS.map(f => `<td>${f.text ? '' : fmt(t[f.key])}</td>`).join('') + `</tr>`;
}
function sheetHeader(title) {
  return `<div class="sheet-head"><div class="company">${esc(db.settings.company)}</div>
    <div class="title">${title}</div></div>`;
}
function ivaTable(t, caption) {
  const rows = ivaRows(t);
  const tot = rows.reduce((a, r) => ({ lordo: a.lordo + r.lordo, imponibile: a.imponibile + r.imponibile, imposta: a.imposta + r.imposta }), { lordo: 0, imponibile: 0, imposta: 0 });
  return `<div><h3>${caption}</h3><table class="iva"><thead><tr><th>Aliquota</th><th>Lordo</th><th>Imponibile</th><th>IVA a debito</th></tr></thead><tbody>`
    + rows.map(r => `<tr><td>${r.rate}%</td><td>${fmt(r.lordo)}</td><td>${fmt(r.imponibile)}</td><td>${fmt(r.imposta)}</td></tr>`).join('')
    + `<tr class="tot"><td>Totale</td><td>${fmt(tot.lordo)}</td><td>${fmt(tot.imponibile)}</td><td>${fmt(tot.imposta)}</td></tr></tbody></table>
    <p class="note">IVA calcolata per scorporo dal lordo. ${Number(db.settings.payRate) ? `POS, Bonifico e Assegni conteggiati al ${db.settings.payRate}%.` : 'POS, Bonifico e Assegni non conteggiati.'} Operazioni esenti e altri importi esclusi.</p></div>`;
}
function renderMonth() {
  const y = curYear, m = curMonth, md = monthData(y, m), n = daysIn(y, m);
  let body = '';
  for (let d = 1; d <= n; d++) {
    const r = md[d] || {}, wd = new Date(y, m - 1, d).getDay();
    body += `<tr class="${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}" data-d="${d}">
      <td class="day">${d}<small>${WD[wd]}</small></td><td class="total">${fmtIn(dayTotal(r) || '')}</td>`
      + FIELDS.map(f => `<td><input data-k="${f.key}" class="${f.text ? 'txt' : ''}" ${f.text ? '' : 'inputmode="decimal"'}
          value="${f.text ? esc(r[f.key]) : fmtIn(r[f.key])}" aria-label="${f.label} giorno ${d}"></td>`).join('') + `</tr>`;
  }
  const mt = monthTotals(y, m), sheet = document.getElementById('sheet');
  const cards = isPhone();
  sheet.classList.toggle('cards', cards);
  sheet.innerHTML =
    sheetHeader(`CORRISPETTIVI ${MONTHS[m - 1]} ${y}`)
    + (cards
      ? `<div class="days">${dayCards(y, m, md, n)}</div><div class="mtotals" id="foot">${monthTotalsCard(mt)}</div>`
      : `<div class="table-wrap"><table class="reg">${colgroup()}<thead>${headRows()}</thead><tbody>
        ${body}</tbody></table></div>` + totTable(monthFoot(mt)))
    + `<div class="bottom">${ivaTable(mt, `Calcolo IVA – ${capMonth(m)} ${y}`)}
        ${kpisHtml(mt)}${versBox(y, m)}</div>
`;
}
const phoneMQ = window.matchMedia('(max-width: 720px)');
const isPhone = () => phoneMQ.matches;
function fieldLabel(f) {
  return f.group.startsWith('OPERAZIONI') ? (f.text ? 'Esenti – titolo e norma' : 'Esenti – importo')
    : f.group === 'FATTURE' ? `Fatture ${f.label.toLowerCase()}`
    : f.group.startsWith('ALTRI') ? 'Altri importi non sogg. IVA'
    : f.rate ? `Corrispettivi ${f.label}` : f.key === 'pos' ? 'POS' : f.label.charAt(0) + f.label.slice(1).toLowerCase();
}
function daySummary(r) {
  return FIELDS.filter(f => r[f.key] !== undefined)
    .map(f => f.text ? `${fieldLabel(f)} ${r[f.key]}` : `${f.label} ${fmt(r[f.key])}`).join(' · ');
}
function dayCards(y, m, md, n) {
  let html = '';
  const isToday = d => y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate();
  for (let d = 1; d <= n; d++) {
    const r = md[d] || {}, wd = new Date(y, m - 1, d).getDay();
    html += `<details class="dcard ${wd === 0 ? 'sun' : ''}" data-d="${d}" ${isToday(d) ? 'open' : ''}>
      <summary><span class="dnum">${d}<small>${WD[wd]}</small></span><span class="dsum">${esc(daySummary(r))}</span>
        <span class="total">${fmtIn(dayTotal(r) || '')}</span></summary>
      <div class="fields">${FIELDS.map(f => `<label class="${f.isNew ? 'new' : ''}">${fieldLabel(f)}
        <input data-k="${f.key}" class="${f.text ? 'txt' : ''}" ${f.text ? '' : 'inputmode="decimal"'}
          value="${f.text ? esc(r[f.key]) : fmtIn(r[f.key])}"></label>`).join('')}</div></details>`;
  }
  return html;
}
function monthTotalsCard(mt) {
  return `<h3>Totale mese: € ${fmt(mt.totale)}</h3><dl>`
    + NUM_FIELDS.filter(f => mt[f.key]).map(f => `<dt>${fieldLabel(f)}</dt><dd>${fmt(mt[f.key])}</dd>`).join('')
    + `</dl>`;
}
// riquadro Versamento: un set di campi per mese, salvato in db.versamenti["anno-mese"]
const VERS_FIELDS = [
  { key: 'periodo', label: 'Mese / trimestre di' },
  { key: 'diretto', label: 'Diretto a' },
  { key: 'importo', label: 'Di €', amount: true },
  { key: 'data', label: 'Effettuato il', date: true },
  { key: 'mezzo', label: 'A mezzo' },
];
const versKey = (y, m) => `${y}-${m}`;
const versData = (y, m) => (db.versamenti || {})[versKey(y, m)] || {};
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
const capMonth = m => MONTHS[m - 1].charAt(0) + MONTHS[m - 1].slice(1).toLowerCase();
function versBox(y, m) {
  const v = versData(y, m);
  return `<div class="vers"><h3>Versamento</h3><div class="vbox">${VERS_FIELDS.map(f => `<label>${f.label}
    <input data-v="${f.key}" class="${f.amount ? 'vamt' : 'txt'}" ${f.amount ? 'inputmode="decimal"' : ''} type="${f.date ? 'date' : 'text'}"
      value="${f.amount ? fmtIn(v[f.key]) : esc(v[f.key])}"></label>`).join('')}</div></div>`;
}
function renderYear() {
  const y = curYear;
  let tot = monthTotals(y, 0), body = '';
  for (let m = 1; m <= 12; m++) {
    const t = monthTotals(y, m); tot = addTotals(tot, t);
    body += `<tr class="sum"><td class="lbl"><a href="#" data-goto="${m}">${MONTHS[m - 1]}</a></td><td class="tsum">${fmt(t.totale)}</td>`
      + FIELDS.map(f => `<td>${f.text ? '' : fmt(t[f.key])}</td>`).join('') + `</tr>`;
  }
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cards');
  sheet.innerHTML =
    sheetHeader(`RIEPILOGO CORRISPETTIVI ANNO ${y}${lastMonthLabel(y)}`)
    + `<div class="table-wrap"><table class="reg">${colgroup()}<thead>${headRows('MESE', 'TOTALE<br>CORRISPETTIVI<br>MENSILI')}</thead><tbody>${body}</tbody></table></div>`
    + totTable(yearFoot(tot)) + `
       <div class="bottom">${ivaTable(tot, `Calcolo IVA – Anno ${y}`)}</div>`;
}
function render() {
  renderYearSel(); renderTabs();
  curMonth === 0 ? renderYear() : renderMonth();
  document.querySelector('#tabs .active')?.scrollIntoView({ block: 'nearest', inline: 'center' });
}
phoneMQ.addEventListener('change', () => render());
function refreshTotals(row) {
  const r = monthData(curYear, curMonth)[row.dataset.d] || {};
  row.querySelector('.total').textContent = fmtIn(dayTotal(r) || '');
  row.querySelector('.dsum')?.replaceChildren(daySummary(r));
  const mt = monthTotals(curYear, curMonth);
  const foot = document.getElementById('foot');
  foot.innerHTML = foot.tagName === 'TBODY' ? monthFoot(mt) : monthTotalsCard(mt);
  const bottom = document.querySelector('.bottom');
  bottom.firstElementChild.outerHTML = ivaTable(mt, `Calcolo IVA – ${capMonth(curMonth)} ${curYear}`);
  bottom.querySelector('.kpis').outerHTML = kpisHtml(mt);
}

// ---------- evidenziazione a croce ----------
const sheetEl = document.getElementById('sheet');
let hlCells = [];
function clearHl() { hlCells.forEach(c => c.classList.remove('hl', 'hl-x')); hlCells = []; }
function crosshair(cell) {
  clearHl();
  const table = cell?.closest('table.reg');
  if (!table || cell.tagName !== 'TD') return;
  const row = cell.parentElement, ci = cell.cellIndex;
  const add = (c, cls) => { if (c) { c.classList.add(cls); hlCells.push(c); } };
  [...row.cells].forEach(c => add(c, 'hl'));
  // la colonna si illumina sia nella tabella dei giorni sia in quella del totale
  sheetEl.querySelectorAll('table.reg').forEach(t => {
    t.querySelectorAll('tbody tr:not(.h1):not(.h2)').forEach(tr => add(tr.cells[ci], 'hl'));
    // intestazioni: colonne 0-1 nella prima riga, le altre nella seconda
    t.querySelectorAll('tr.h1').forEach(h1 => add(ci < 2 ? h1.cells[ci] : h1.nextElementSibling.cells[ci - 2], 'hl'));
  });
  cell.classList.replace('hl', 'hl-x');
}
sheetEl.addEventListener('scroll', e => { // tablet: le due tabelle scorrono di lato insieme
  if (!e.target.classList?.contains('table-wrap')) return;
  sheetEl.querySelectorAll('.table-wrap').forEach(w => { if (w !== e.target) w.scrollLeft = e.target.scrollLeft; });
}, true);
sheetEl.addEventListener('mouseover', e => {
  const cell = e.target.closest('td');
  if (cell && !cell.classList.contains('hl-x')) crosshair(cell);
});
sheetEl.addEventListener('mouseleave', () => {
  const f = document.activeElement?.closest?.('table.reg td');
  f ? crosshair(f) : clearHl();
});
sheetEl.addEventListener('focusin', e => crosshair(e.target.closest('table.reg td')));

// altezza della barra in alto, per agganciarci sotto l'intestazione della tabella
// --top-h = altezza della barra (le schede si agganciano sotto); --bar-h = barra + schede (l'intestazione della tabella si aggancia sotto)
const barEl = document.querySelector('header.bar'), tabsEl = document.getElementById('tabs');
const stickRO = new ResizeObserver(() => {
  document.documentElement.style.setProperty('--top-h', barEl.offsetHeight + 'px');
  document.documentElement.style.setProperty('--bar-h', barEl.offsetHeight + tabsEl.offsetHeight + 'px');
});
stickRO.observe(barEl); stickRO.observe(tabsEl);

// ---------- eventi ----------
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curMonth = Number(b.dataset.m); render();
});
document.getElementById('sheet').addEventListener('click', e => {
  const a = e.target.closest('[data-goto]'); if (!a) return;
  e.preventDefault(); curMonth = Number(a.dataset.goto); render();
});
document.getElementById('yearSel').addEventListener('change', e => { curYear = Number(e.target.value); render(); });
document.getElementById('newYear').addEventListener('click', async () => {
  const y = Number(await uiPrompt('Anno da aggiungere:', Math.max(...Object.keys(db.years).map(Number), today.getFullYear() - 1) + 1));
  if (!y || y < 2000 || y > 2100) return;
  yearData(y); save(); curYear = y; curMonth = 1; render();
});
document.getElementById('sheet').addEventListener('change', e => {
  const inp = e.target; if (inp.tagName !== 'INPUT') return;
  if (inp.dataset.v) { // campi del riquadro Versamento
    const k = inp.dataset.v, f = VERS_FIELDS.find(x => x.key === k);
    db.versamenti = db.versamenti || {};
    const v = (db.versamenti[versKey(curYear, curMonth)] = db.versamenti[versKey(curYear, curMonth)] || {});
    let val = inp.value.trim();
    if (f.amount && val) {
      val = parseNum(val);
      if (Number.isNaN(val)) { toast('Importo non valido'); inp.value = fmtIn(v[k]); return; }
      inp.value = fmtIn(val);
    }
    val === '' || val === null ? delete v[k] : v[k] = val;
    if (!Object.keys(v).length) delete db.versamenti[versKey(curYear, curMonth)];
    save(); return;
  }
  const tr = inp.closest('[data-d]'), d = tr.dataset.d, k = inp.dataset.k;
  const field = FIELDS.find(f => f.key === k);
  const md = monthData(curYear, curMonth), r = (md[d] = md[d] || {});
  if (field.text) {
    const v = inp.value.trim(); v ? r[k] = v : delete r[k];
  } else {
    const v = parseNum(inp.value);
    if (Number.isNaN(v)) { toast('Importo non valido'); inp.value = fmtIn(r[k]); inp.focus(); return; }
    v === null || v === 0 ? delete r[k] : r[k] = v;
    inp.value = fmtIn(r[k]);
  }
  if (!Object.keys(r).length) delete md[d];
  save(); refreshTotals(tr);
});
document.getElementById('sheet').addEventListener('focusin', e => {
  const inp = e.target;
  if (inp.tagName === 'INPUT' && !inp.classList.contains('txt') && inp.type !== 'date' && inp.value) {
    inp.value = inp.value.replace(/\./g, ''); inp.select();
  }
});
document.getElementById('sheet').addEventListener('focusout', e => {
  const inp = e.target;
  if (inp.tagName === 'INPUT' && !inp.classList.contains('txt') && inp.type !== 'date') {
    const v = parseNum(inp.value); if (v !== null && !Number.isNaN(v)) inp.value = fmtIn(v);
  }
});
// Invio = riga sotto, frecce su/giù per spostarsi
document.getElementById('sheet').addEventListener('keydown', e => {
  const inp = e.target; if (inp.tagName !== 'INPUT') return;
  let dir = 0;
  if (e.key === 'Enter' || e.key === 'ArrowDown') dir = e.shiftKey && e.key === 'Enter' ? -1 : 1;
  else if (e.key === 'ArrowUp') dir = -1;
  if (!dir) return;
  const card = inp.closest('.dcard, .vers');
  if (card) { // schede e Versamento: Invio passa al campo successivo
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const ins = [...card.querySelectorAll('input')], i = ins.indexOf(inp) + dir;
    ins[i] ? ins[i].focus() : inp.blur();
    return;
  }
  e.preventDefault();
  let tr = inp.closest('tr');
  tr = dir > 0 ? tr.nextElementSibling : tr.previousElementSibling;
  const next = tr?.querySelector(`input[data-k="${inp.dataset.k}"]`);
  if (next) { inp.blur(); next.focus(); }
});

// ---------- stampa su un unico foglio A4 verticale ----------
const P_WIDTHS = [13, ...Array(12).fill(181 / 12)]; // mm, totale 194: Giorno stretta, le altre uguali
const P_GROUPS = { 'CORRISPETTIVI': 'CORRISPETTIVI', 'FATTURE': 'FATTURE',
  'OPERAZIONI ESENTI O NON IMPONIBILI': 'OPERAZ. ESENTI O NON IMPONIBILI',
  'ALTRI IMPORTI PER OPERAZIONI NON SOGGETTE A REGISTRAZIONE IVA (1)': 'ALTRI IMPORTI NON SOGG. A REG. IVA (1)' };
const pAmt = v => v ? fmt(v) : '';
function pHead(first, totLabel) {
  const groups = [];
  FIELDS.forEach(f => {
    const last = groups[groups.length - 1];
    if (last && last.name === f.group) last.span++; else groups.push({ name: f.group, span: 1 });
  });
  return `<colgroup>${P_WIDTHS.map(w => `<col style="width:${w}mm">`).join('')}</colgroup>
    <thead>${pHeadRows(first, totLabel)}</thead>`;
}
function pHeadRows(first, totLabel = 'TOTALE<br>CORRISPETTIVI<br>GIORNALIERI') {
  const groups = [];
  FIELDS.forEach(f => {
    const last = groups[groups.length - 1];
    if (last && last.name === f.group) last.span++; else groups.push({ name: f.group, span: 1 });
  });
  return `<tr class="grp"><th rowspan="2">${first}</th><th rowspan="2">${totLabel}</th>`
    + groups.map(g => `<th colspan="${g.span}">${P_GROUPS[g.name]}</th>`).join('')
    + `</tr><tr>${FIELDS.map(f => `<th>${f.key === 'titolo' ? 'TITOLO E NORMA' : f.label}</th>`).join('')}</tr>`;
}
const pTotTable = (head, label, t) => `<table class="p-reg p-tot"><colgroup>${P_WIDTHS.map(w => `<col style="width:${w}mm">`).join('')}</colgroup>
  <tbody>${pHeadRows('', head)}${pSum(label, t, 'grand')}</tbody></table>`;
function pSum(label, t, cls = '') {
  return `<tr class="sum ${cls}"><td class="d">${label}</td><td class="tot">${fmt(t.totale)}</td>`
    + FIELDS.map(f => `<td>${f.text ? '' : fmt(t[f.key])}</td>`).join('') + `</tr>`;
}
function pIva(t, caption) {
  const rows = ivaRows(t);
  const tot = rows.reduce((a, r) => ({ lordo: a.lordo + r.lordo, imponibile: a.imponibile + r.imponibile, imposta: a.imposta + r.imposta }), { lordo: 0, imponibile: 0, imposta: 0 });
  return `<div><div class="p-cap">${caption}</div><table class="p-iva"><thead><tr><th>Aliquota</th><th>Lordo</th><th>Imponibile</th><th>IVA a debito</th></tr></thead><tbody>`
    + rows.map(r => `<tr><td>${r.rate}%</td><td>${fmt(r.lordo)}</td><td>${fmt(r.imponibile)}</td><td>${fmt(r.imposta)}</td></tr>`).join('')
    + `<tr class="tot"><td>Totale</td><td>${fmt(tot.lordo)}</td><td>${fmt(tot.imponibile)}</td><td>${fmt(tot.imposta)}</td></tr></tbody></table></div>`;
}
function pBox(y, m) {
  const v = versData(y, m);
  const val = f => esc(f.amount ? (v[f.key] !== undefined ? fmt(v[f.key]) : '') : f.date ? fmtDate(v[f.key]) : v[f.key]);
  return `<div><div class="p-cap">Versamento</div><div class="p-box">`
    + VERS_FIELDS.map(f => `${f.label} <span>${val(f)}</span>`).join('<br>') + `</div></div>`;
}
const P_NOTE = `<div class="p-note">(1) Registrazioni obbligatorie per la contabilità semplificata delle imprese minori (sopravvenienze attive, plusvalenze ecc.)</div>`;
function buildPrint() {
  const y = curYear, m = curMonth, company = esc(db.settings.company);
  let html;
  if (m === 0) {
    let tot = monthTotals(y, 0), body = '';
    for (let i = 1; i <= 12; i++) {
      const t = monthTotals(y, i); tot = addTotals(tot, t);
      body += `<tr class="sum"><td class="d">${MONTHS[i - 1]}</td><td class="tot">${pAmt(t.totale)}</td>`
        + FIELDS.map(f => `<td>${f.text ? '' : pAmt(t[f.key])}</td>`).join('') + `</tr>`;
    }
    html = `<div class="p-head"><div class="p-company">${company}</div><div class="p-title">RIEPILOGO CORRISPETTIVI ANNO ${y}${lastMonthLabel(y)}</div></div>
      <table class="p-reg">${pHead('MESE', 'TOTALE<br>CORRISPETTIVI<br>MENSILI')}<tbody>${body}</tbody></table>
      ${pTotTable('TOTALE<br>CORRISPETTIVI<br>ANNUALE', 'TOTALE<br>ANNUO', tot)}
      <div class="p-bottom">${pIva(tot, `Calcolo IVA – Anno ${y}`)}</div>${P_NOTE}`;
  } else {
    const md = db.years[y]?.[m] || {}, n = daysIn(y, m);
    const mt = monthTotals(y, m);
    let body = '';
    for (let d = 1; d <= n; d++) {
      const r = md[d] || {}, wd = new Date(y, m - 1, d).getDay();
      body += `<tr class="${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}"><td class="d">${d}<small>${WD[wd]}</small></td><td class="tot">${pAmt(dayTotal(r))}</td>`
        + FIELDS.map(f => f.text ? `<td class="t">${esc(r[f.key])}</td>` : `<td>${pAmt(r[f.key])}</td>`).join('') + `</tr>`;
    }
    html = `<div class="p-head"><div class="p-company">${company}</div>
        <div class="p-title">CORRISPETTIVI ${MONTHS[m - 1]} ${y}</div></div>
      <table class="p-reg">${pHead('GIORNO')}<tbody>${body}</tbody></table>
      ${pTotTable('TOTALE<br>CORRISPETTIVI<br>MENSILI', 'TOT. MESE', mt)}
      <div class="p-bottom">${pIva(mt, `Calcolo IVA – ${capMonth(m)} ${y}`)}${pBox(y, m)}</div>${P_NOTE}`;
  }
  document.getElementById('printArea').innerHTML = html;
}

// PDF A4: stesso foglio della stampa, scaricato direttamente
async function exportPdf() {
  const btn = document.getElementById('btnPdf'), el = document.getElementById('printArea');
  btn.disabled = true; toast('Creazione PDF…');
  buildPrint(); el.classList.add('pdf-render');
  try {
    await document.fonts?.ready;
    const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff', logging: false });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const MX = 8, MY = 7, MAX_W = 194, MAX_H = 283; // stessi margini della stampa
    let w = MAX_W, h = canvas.height * w / canvas.width;
    if (h > MAX_H) { h = MAX_H; w = canvas.width * h / canvas.height; }
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', MX + (MAX_W - w) / 2, MY, w, h, undefined, 'FAST');
    const name = curMonth === 0
      ? `Riepilogo Corrispettivi ${curYear}`
      : `Corrispettivi ${MONTHS[curMonth - 1].charAt(0) + MONTHS[curMonth - 1].slice(1).toLowerCase()} ${curYear}`;
    pdf.setProperties({ title: name });
    pdf.save(name + '.pdf');
    toast('PDF scaricato');
  } catch (err) {
    uiAlert('Errore nella creazione del PDF: ' + err.message);
  } finally {
    el.classList.remove('pdf-render'); btn.disabled = false;
  }
}

// anteprima di stampa: mostra il foglio A4 esattamente come verrà stampato
const dlgPreview = document.getElementById('dlgPreview');
// zoom come in un lettore PDF: 100% = dimensione reale del foglio
const PV_W = 210 * 96 / 25.4, PV_H = 297 * 96 / 25.4; // A4 in px CSS
const PV_MIN = 0.25, PV_MAX = 4;
const pvPage = dlgPreview.querySelector('.pv-page'), pvStage = dlgPreview.querySelector('.pv-stage');
let pvK = 1, pvMode = 'page'; // 'page' | 'width' | 'custom'
function pvFitK(mode) {
  const availW = dlgPreview.clientWidth - 24;
  const availH = dlgPreview.clientHeight - dlgPreview.querySelector('.pv-bar').offsetHeight - 52;
  return mode === 'width' ? availW / PV_W : Math.min(availW / PV_W, availH / PV_H);
}
function pvSetZoom(k, anchor) {
  k = Math.min(PV_MAX, Math.max(PV_MIN, k));
  // il punto sotto il cursore resta fermo mentre si ingrandisce
  const r = pvPage.getBoundingClientRect();
  const ax = anchor ? anchor.x : dlgPreview.clientWidth / 2, ay = anchor ? anchor.y : dlgPreview.clientHeight / 2;
  const ux = (ax - r.left) / pvK, uy = (ay - r.top) / pvK;
  pvK = k;
  pvPage.style.zoom = k;
  const r2 = pvPage.getBoundingClientRect();
  dlgPreview.scrollLeft += r2.left + ux * k - ax;
  dlgPreview.scrollTop += r2.top + uy * k - ay;
  document.getElementById('pvPct').textContent = Math.round(k * 100) + '%';
}
function fitPreview(mode = pvMode) {
  pvMode = mode;
  pvSetZoom(pvFitK(mode === 'custom' ? 'page' : mode));
  dlgPreview.scrollTop = 0;
}
const PV_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4];
function pvStep(dir, anchor) {
  pvMode = 'custom';
  const next = dir > 0 ? PV_STEPS.find(z => z > pvK + 0.001) : [...PV_STEPS].reverse().find(z => z < pvK - 0.001);
  pvSetZoom(next ?? pvK, anchor);
}
function openPreview() {
  buildPrint();
  document.getElementById('pvContent').innerHTML = document.getElementById('printArea').innerHTML;
  dlgPreview.showModal();
  pvStage.focus(); // così i tasti + / − / 0 funzionano subito
  // su telefono parte adattato alla larghezza, su PC con il foglio intero
  fitPreview(window.innerWidth < 720 ? 'width' : 'page');
}
document.getElementById('pvIn').addEventListener('click', () => pvStep(1));
document.getElementById('pvOut').addEventListener('click', () => pvStep(-1));
document.getElementById('pvFitPage').addEventListener('click', () => fitPreview('page'));
document.getElementById('pvFitWidth').addEventListener('click', () => fitPreview('width'));
// Ctrl + rotellina (o pizzico sul touchpad) = zoom verso il punto del cursore
dlgPreview.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  pvMode = 'custom';
  pvSetZoom(pvK * Math.pow(1.0015, -e.deltaY), { x: e.clientX, y: e.clientY });
}, { passive: false });
// tasti + / − / 0 (anche con Ctrl)
dlgPreview.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') { e.preventDefault(); pvStep(1); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); pvStep(-1); }
  else if (e.key === '0') { e.preventDefault(); fitPreview('page'); }
});
// trascina il foglio con il mouse per spostarti quando è ingrandito
let pvPan = null;
pvStage.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  pvPan = { x: e.clientX, y: e.clientY, l: dlgPreview.scrollLeft, t: dlgPreview.scrollTop };
  pvStage.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!pvPan) return;
  dlgPreview.scrollLeft = pvPan.l - (e.clientX - pvPan.x);
  dlgPreview.scrollTop = pvPan.t - (e.clientY - pvPan.y);
});
window.addEventListener('mouseup', () => { pvPan = null; pvStage.classList.remove('panning'); });
document.getElementById('btnPreview').addEventListener('click', openPreview);
document.getElementById('pvClose').addEventListener('click', () => dlgPreview.close());
document.getElementById('pvPrint').addEventListener('click', () => { dlgPreview.close(); buildPrint(); window.print(); });

// export Excel (un foglio per mese + riepilogo, con formule)
const XL_COLS = ['GIORNO', 'DATA', 'TOTALE CORRISPETTIVI GIORNALIERI', ...FIELDS.map(f =>
  f.group === 'CORRISPETTIVI' ? (f.rate ? `CORRISPETTIVI ${f.label}` : f.label)
  : f.group.startsWith('OPERAZIONI') ? (f.text ? 'ESENTI - TITOLO E NORMA' : 'ESENTI - IMPORTO')
  : f.group === 'FATTURE' ? `FATTURE ${f.label}` : 'ALTRI IMPORTI NON SOGGETTI IVA')];
const colL = i => XLSX.utils.encode_col(i);
document.getElementById('btnExport').addEventListener('click', () => {
  const y = curYear, wb = XLSX.utils.book_new();
  const firstNum = 3, totCol = 2;
  const sumIdx = FIELDS.map((f, i) => f.sum ? i + firstNum : -1).filter(i => i >= 0);
  for (let m = 1; m <= 12; m++) {
    const md = db.years[y]?.[m] || {}, n = daysIn(y, m);
    const aoa = [[`CORRISPETTIVI ${MONTHS[m - 1]} ${y}`], [db.settings.company.replace(/\n/g, ' - ')], [], XL_COLS];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const hdr = 4; // riga intestazioni (1-based)
    for (let d = 1; d <= n; d++) {
      const R = hdr + d - 1, r = md[d] || {}, row = R + 1;
      ws[XLSX.utils.encode_cell({ r: R, c: 0 })] = { t: 'n', v: d };
      ws[XLSX.utils.encode_cell({ r: R, c: 1 })] = { t: 'd', v: new Date(Date.UTC(y, m - 1, d)), z: 'dd/mm/yyyy' };
      ws[XLSX.utils.encode_cell({ r: R, c: totCol })] = { t: 'n', v: round2(dayTotal(r)), z: '#,##0.00',
        f: sumIdx.map(c => `${colL(c)}${row}`).join('+') };
      FIELDS.forEach((f, i) => {
        const v = r[f.key]; if (v === undefined) return;
        ws[XLSX.utils.encode_cell({ r: R, c: i + firstNum })] = f.text ? { t: 's', v: String(v) } : { t: 'n', v, z: '#,##0.00' };
      });
    }
    const T = hdr + n, mt = monthTotals(y, m);
    ws[XLSX.utils.encode_cell({ r: T, c: 0 })] = { t: 's', v: 'TOTALE' };
    [totCol, ...FIELDS.map((f, i) => f.text ? -1 : i + firstNum).filter(i => i >= 0)].forEach(c => {
      const key = c === totCol ? 'totale' : FIELDS[c - firstNum].key;
      ws[XLSX.utils.encode_cell({ r: T, c })] = { t: 'n', v: round2(mt[key]), z: '#,##0.00', f: `SUM(${colL(c)}${hdr + 1}:${colL(c)}${hdr + n})` };
    });
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: T, c: XL_COLS.length - 1 } });
    ws['!cols'] = XL_COLS.map((h, i) => ({ wch: i < 2 ? 11 : Math.max(12, Math.min(h.length + 2, 22)) }));
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: XL_COLS.length - 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: XL_COLS.length - 1 } }];
    XLSX.utils.book_append_sheet(wb, ws, MONTHS[m - 1]);
  }
  // riepilogo
  const head = ['MESE', 'TOTALE CORRISPETTIVI', ...NUM_FIELDS.map(f => XL_COLS[FIELDS.indexOf(f) + firstNum])];
  const rows = [[`RIEPILOGO CORRISPETTIVI ANNO ${y}`], [], head];
  for (let m = 1; m <= 12; m++) { const t = monthTotals(y, m); rows.push([MONTHS[m - 1], round2(t.totale), ...NUM_FIELDS.map(f => round2(t[f.key]))]); }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const last = rows.length;
  ws[XLSX.utils.encode_cell({ r: last, c: 0 })] = { t: 's', v: 'TOTALE ANNUO' };
  for (let c = 1; c < head.length; c++)
    ws[XLSX.utils.encode_cell({ r: last, c })] = { t: 'n', v: round2(rows.slice(3).reduce((s, r) => s + r[c], 0)), f: `SUM(${colL(c)}4:${colL(c)}15)`, z: '#,##0.00' };
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: last, c: head.length - 1 } });
  ws['!cols'] = head.map(() => ({ wch: 18 }));
  XLSX.utils.book_append_sheet(wb, ws, 'RIEPILOGO');
  XLSX.writeFile(wb, `Registro dei Corrispettivi ${y}.xlsx`);
  toast('Excel esportato');
});

// import Excel: accetta sia il modello originale (colonne K/M/O/R/U...) sia il file esportato dall'app
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileXlsx').click());
document.getElementById('fileXlsx').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
    const yearMatch = f.name.match(/(20\d\d)/);
    const imported = {}; let year = yearMatch ? Number(yearMatch[1]) : curYear, cells = 0;
    wb.SheetNames.forEach(name => {
      const m = MONTHS.indexOf(name.trim().toUpperCase()) + 1; if (!m) return;
      const ws = wb.Sheets[name], get = a => ws[a]?.v;
      const md = (imported[m] = {});
      if (String(get('R13') || '').toUpperCase().includes('POS')) {
        // modello originale: giorno d alla riga 17 + 2*(d-1)
        if (typeof get('A13') === 'number') year = get('A13');
        const map = { K: 'iva4', M: 'iva10', O: 'iva22', R: 'pos', U: 'assegni', X: 'esenti', Z: 'titolo', AB: 'fattDal', AD: 'fattAl', AF: 'altri' };
        // eventuale colonna Bonifico aggiunta a mano: cerca "BONIFICO" nella riga 13
        Object.keys(ws).filter(a => /^[A-Z]+13$/.test(a) && String(ws[a].v).toUpperCase().includes('BONIFICO'))
          .forEach(a => map[a.replace('13', '')] = 'bonifico');
        for (let d = 1; d <= 31; d++) {
          const row = 17 + 2 * (d - 1);
          for (const col in map) {
            const v = get(col + row); if (v === undefined || v === null || v === '') continue;
            const fld = FIELDS.find(x => x.key === map[col]);
            if (fld.text) (md[d] = md[d] || {})[fld.key] = String(v);
            else if (typeof v === 'number' && v) { (md[d] = md[d] || {})[fld.key] = round2(v); cells++; }
          }
        }
      } else {
        // formato esportato dall'app
        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
        const t = String(aoa[0]?.[0] || '').match(/(?:ANNO )?(\d{4})\s*$/); if (t) year = Number(t[1]);
        const hi = aoa.findIndex(r => r[0] === 'GIORNO'); if (hi < 0) return;
        const h = aoa[hi];
        aoa.slice(hi + 1).forEach(r => {
          const d = r[0]; if (typeof d !== 'number') return;
          FIELDS.forEach((fld, i) => {
            const c = h.indexOf(XL_COLS[i + 3]); const v = c >= 0 ? r[c] : undefined;
            if (v === undefined || v === null || v === '') return;
            if (fld.text) (md[d] = md[d] || {})[fld.key] = String(v);
            else if (typeof v === 'number' && v) { (md[d] = md[d] || {})[fld.key] = round2(v); cells++; }
          });
        });
      }
    });
    if (!Object.keys(imported).length) throw new Error('nessun foglio mensile (GENNAIO…DICEMBRE) trovato');
    if (db.years[year] && Object.keys(db.years[year]).some(k => Object.keys(db.years[year][k]).length)
        && !(await uiConfirm(`L'anno ${year} contiene già dati. Sostituirli con quelli del file?`))) return;
    db.years[year] = imported; save(); curYear = year; render();
    toast(`Importati ${cells} importi nell'anno ${year}`);
  } catch (err) { uiAlert('Errore importazione: ' + err.message); }
});

  go.addEventListener('click', () => {
    go.disabled = close.disabled = true; bar.style.display = 'block';
    msg.textContent = "Download dell'aggiornamento in corso…";
    window.updater.download();
  });
  window.updater.onAvailable(v => {
    reset();
    msg.textContent = `È disponibile la versione ${v.version} del Registro Corrispettivi (installata: ${v.current}). Vuoi aggiornare adesso? I tuoi dati restano salvati.`;
    if (!dlg.open) dlg.showModal();
    go.focus();
  });
  window.updater.onProgress(p => { fill.style.width = Math.round(p) + '%'; msg.textContent = `Download dell'aggiornamento… ${Math.round(p)}%`; });
  window.updater.onDownloaded(() => { msg.textContent = "Installazione in corso, l'app si riaprirà da sola…"; });
  window.updater.onError(err => {
    reset();
    msg.textContent = 'Aggiornamento non riuscito: ' + err + '. Riprova più tardi.';
    if (!dlg.open) dlg.showModal();
  });
  window.updater.onNone(v => toast(`Hai già la versione più recente (${v})`));
}

render();
</script>
</body>
</html>
